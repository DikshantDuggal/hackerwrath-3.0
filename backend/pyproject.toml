[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scam-call-detection-backend"
version = "1.0.0"
description = "Backend-only AI-powered multilingual scam-call detection system using FastAPI, Sarvam Saaras STT, Rule-Based Engine, Contextual AI Director, and Calibrated Risk Scoring."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v -q"
