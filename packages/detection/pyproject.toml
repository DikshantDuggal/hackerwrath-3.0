[project]
name = "edgerunners-detection"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["edgerunners-contracts"]

[tool.uv.sources]
edgerunners-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
