name: checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
      - run: uv sync --all-packages --locked
      - run: make check
      - run: make build-python
      - run: docker build -t edgerunners-api .
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: make build-android
      - uses: actions/upload-artifact@v4
        with:
          name: edgerunners-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
